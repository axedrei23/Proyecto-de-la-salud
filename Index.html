<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <title>Relaciones Saludables</title>

  <style>
body {
  font-family: Arial, sans-serif;
  margin: 20px;
  background: linear-gradient(135deg, #eaf4ff, #f4edff);
  color: #263247;
}

h2 {
  color: #315b91;
  text-align: center;
  margin-bottom: 22px;
}

body > h2 {
  font-size: 44px;
  font-weight: 800;
  letter-spacing: 2px;
  color: #ffffff;
  background: linear-gradient(90deg, #315b91, #8064b5);
  padding: 28px 20px;
  margin: 10px auto 28px;
  max-width: 850px;
  border-radius: 16px;
  text-shadow: 0 2px 5px rgba(0, 0, 0, 0.18);
  box-shadow: 0 6px 18px rgba(48, 82, 125, 0.18);
}

#formulario, #seccionTabla {
  max-width: 850px;
  margin: 20px auto;
  padding: 28px;
  background: #ffffff;
  border: 1px solid #d7e3f3;
  border-radius: 16px;
  box-shadow: 0 6px 20px rgba(48, 82, 125, 0.12);
}

label {
  display: inline-block;
  margin: 12px 0 7px;
  color: #344d70;
  font-weight: bold;
  line-height: 1.5;
}

select, input {
  max-width: 100%;
  box-sizing: border-box;
  padding: 11px 12px;
  border: 1px solid #bdcde2;
  border-radius: 8px;
  background: #fbfdff;
  color: #263247;
  font-size: 14px;
}

select {
  width: 100%;
  margin-top: 4px;
}

select:focus, input:focus {
  outline: none;
  border-color: #668fc5;
  box-shadow: 0 0 0 3px rgba(102, 143, 197, 0.16);
}

button {
  margin: 10px 6px 0 0;
  padding: 10px 17px;
  border: none;
  border-radius: 8px;
  background: #4779b8;
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.2s, transform 0.2s;
}

button:hover {
  background: #315f98;
  transform: translateY(-1px);
}

button:disabled {
  background: #aab8c9;
  cursor: not-allowed;
  transform: none;
}

#btnEliminar {
  background: #bd626c;
}

#btnEliminar:hover {
  background: #9f4651;
}

#estado {
  max-width: 850px;
  margin: 12px auto;
  color: #315f98;
  font-weight: bold;
  text-align: center;
}

#buscador {
  width: 100%;
  margin: 8px 0 14px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
  background: white;
  border-radius: 8px;
  overflow: hidden;
}

th, td {
  border: 1px solid #d5dfeb;
  padding: 10px 12px;
  text-align: left;
}

th {
  background: #dceaff;
  color: #294d78;
}

tr:nth-child(even) {
  background: #f5f8fc;
}

#seccionTabla {
  overflow-x: auto;
}

@media (max-width: 600px) {
  body {
    margin: 10px;
  }

  button {
    margin: 7px 4px 0 0;
  }
}
  </style>

</head>

<body>

  <h2>Relaciones Saludables</h2>

  <form id="formulario">

    <!-- >>> CAMPO NUEVO: ANIMAL (1 de 6 en HTML)

         Lista desplegable (<select>) para elegir opciones.

         Para agregar más opciones, simplemente duplica una etiqueta <option>:

         <option value="Elefante">Elefante</option>

    -->

    <label for="reaccion">¿Como sueles reaccionar cuando alguien en tu entorno hace un comentario hacia ti?:</label><br>

    <select id="reaccion" required>

      <option value="" disabled selected>Selecciona una opción...</option>

      <option value="Me aguanto el malestar en silencio o me río para no generar incomodidad">Me aguanto el malestar en silencio o me río para no generar incomodidad</option>

      <option value="Reacciono con molestia e intento responder con otro comentario igual o peor">Reacciono con molestia e intento responder con otro comentario igual o peor</option>

      <option value="Muy difícil, prefiero aguantarme con tal de evitar un conflicto">Muy difícil, prefiero aguantarme con tal de evitar un conflicto</option>

    </select><br><br>    

    <label for="limites">¿Qué tan fácil se te hace decir "eso no me gusta" o poner límites a tus amigos o familia sin sentir culpa?:</label><br>

    <select id="limites" required>

      <option value="" disabled selected>Selecciona una opción...</option>

      <option value="Muy fácil, siempre defiendo mi espacio y mi paz mental">Muy fácil, siempre defiendo mi espacio y mi paz mental</option>

      <option value="A veces me cuesta trabajo porque me da miedo que se molesten conmigo">A veces me cuesta trabajo porque me da miedo que se molesten conmigo</option>

      <option value="Expreso con firmeza y tranquilidad que ese tipo de comentarios no me agradan">Expreso con firmeza y tranquilidad que ese tipo de comentarios no me agradan</option>

    </select><br><br>

    <label for="afecta">¿Cómo crees que afecta a tu salud mental el aguantar burlas constantes por llevarte bien o encajar?:</label><br>

    <select id="afecta" required>

      <option value="" disabled selected>Selecciona una opción...</option>

      <option value="Desgasta mi autoestima y me causa ansiedad o enojo acumulado">Desgasta mi autoestima y me causa ansiedad o enojo acumulado</option>

      <option value="No me afecta en nada, me da exactamente igual">No me afecta en nada, me da exactamente igual</option>

      <option value="Me hace reaccionar de forma agresiva después con otras personas">Me hace reaccionar de forma agresiva después con otras personas</option>

    </select><br><br>

    <label for="lastima">¿Si un amigo cercano te hace una broma que te lastima, ¿cuál consideras que es la respuesta más saludable?:</label><br>

    <select id="lastima" required>

      <option value="" disabled selected>Selecciona una opción...</option>

      <option value="Decirle en privado, Oye, ese comentario no me gustó, por favor no lo repitas">Decirle en privado, Oye, ese comentario no me gustó, por favor no lo repitas</option>

      <option value="Dejarle de hablar de golpe sin decirle por qué">Dejarle de hablar de golpe sin decirle por qué</option>

      <option value="Exhibirlo enfrente de todos para desquitarme ">Exhibirlo enfrente de todos para desquitarme</option>

    </select><br><br>

    <label for="emocional">¿Qué herramienta te llevas hoy para cuidar tus relaciones y tu bienestar emocional?:</label><br>

    <select id="emocional" required>

      <option value="" disabled selected>Selecciona una opción...</option>

      <option value="Expresar lo que siento con respeto y firmeza">Expresar lo que siento con respeto y firmeza</option>

      <option value="Recordar que la burla habla más de la otra persona que de mí">Recordar que la burla habla más de la otra persona que de mí</option>

      <option value="Aprender a alejarme de personas o entornos que no respetan mis límites">Aprender a alejarme de personas o entornos que no respetan mis límites</option>

    </select><br><br>

    <!-- >>> AGREGAR CAMPO NUEVO (lugar 1 de 6 anterior)

         Copia un bloque label + input (o select) y cambia el nombre y el id. -->

    <button type="button" id="btnRegistrar">Registrar</button>

    <button type="button" id="btnConsultar">Consultar</button>

    <button type="button" id="btnModificar">Modificar</button>

    <button type="button" id="btnEliminar">Eliminar</button>

  </form>

  <p id="estado"></p>

  <div id="seccionTabla">

    <h2>Registros</h2>

    <button type="button" id="btnCerrar">Cerrar tabla</button>

    <br><br>

    <input type="text" id="buscador" placeholder="Buscar por nombre...">

    <table>

      <thead>

        <tr>

          <th>reaccion</th> <!-- >>> AGREGAR CAMPO NUEVO (lugar 2 de 6): Encabezado de la tabla -->

          <th>limites</th> <!-- >>> AGREGAR CAMPO NUEVO (lugar 3 de 6): Encabezado de la tabla -->

          <th>afecta</th> <!-- >>> AGREGAR CAMPO NUEVO (lugar 4 de 6): Encabezado de la tabla -->

          <th>lastima</th> <!-- >>> AGREGAR CAMPO NUEVO (lugar 5 de 6): Encabezado de la tabla -->

          <th>emocional</th> <!-- >>> AGREGAR CAMPO NUEVO (lugar 6 de 6): Encabezado de la tabla -->

        </tr>

      </thead>

      <tbody id="tabla"></tbody>

    </table>

  </div>

  <script>

    // Pega aquí la URL de tu implementación de Apps Script

    var URL_SCRIPT = "https://script.google.com/macros/s/AKfycbw2cLlTfpnoeWptXZqwfXXgiK6yZ5sOMsOFql2QMqDze1EhqaSdwCy96LMIbqFwBMLV/exec";

    var registros = [];

    var tablaVisible = false;

    // ---------- Enviar datos al script ----------

    function enviar(datos) {

      return fetch(URL_SCRIPT, {

        method: "POST",

        body: new URLSearchParams(datos)

      }).then(function (r) { return r.json(); });

    }

    // ---------- Botones activos según el estado ----------

    function actualizarBotones() {

      var hayRegistro = document.getElementById("id").value !== "";

      document.getElementById("btnRegistrar").disabled = hayRegistro;

      document.getElementById("btnModificar").disabled = !hayRegistro;

      document.getElementById("btnEliminar").disabled = !hayRegistro;

    }

    function limpiarFormulario() {

      document.getElementById("formulario").reset();

      document.getElementById("id").value = "";

      actualizarBotones();

    }

    // ---------- REGISTRAR ----------

    document.getElementById("btnRegistrar").onclick = function () {

      if (!document.getElementById("formulario").reportValidity()) return;

      document.getElementById("estado").textContent = "Guardando...";

      enviar({

        accion: "guardar",

        // >>> AGREGAR CAMPO NUEVO (lugar 3 de 6)

        // Cada campo termina con coma, EXCEPTO el último.

        reaccion: document.getElementById("reaccion").value,

        limites: document.getElementById("limites").value,

        afecta: document.getElementById("afecta").value,

        lastima: document.getElementById("lastima").value, // Nuevo campo añadido

        emocional: document.getElementById("emocional").value

      }).then(function (respuesta) {

        terminarAccion(respuesta, "¡Registro guardado!");

      });

    };

    // ---------- CONSULTAR ----------

    document.getElementById("btnConsultar").onclick = function () {

      document.getElementById("estado").textContent = "Consultando...";

      tablaVisible = true;

      document.getElementById("seccionTabla").style.display = "block";

      cargarRegistros(function () {

        document.getElementById("estado").textContent = "";

      });

    };

    function cargarRegistros(alTerminar) {

      fetch(URL_SCRIPT)

        .then(function (r) { return r.json(); })

        .then(function (datos) {

          registros = datos;

          mostrarTabla();

          if (alTerminar) alTerminar();

        });

    }

    function mostrarTabla() {

      var filtro = document.getElementById("buscador").value.trim().toLowerCase();

      var tabla = document.getElementById("tabla");

      tabla.innerHTML = "";

      registros.forEach(function (reg) {

        // Solo muestra los nombres que INICIAN con lo escrito

        if (!reg.nombre.toString().toLowerCase().startsWith(filtro)) return;

        var tr = document.createElement("tr");

        agregarCelda(tr, new Date(reg.fecha).toLocaleString());

        // >>> AGREGAR CAMPO NUEVO (lugar 4 de 6)

        // Agrega una línea por cada campo, en el mismo orden que los <th>.

        agregarCelda(tr, reg.reaccion); // Muestra la reacción en la tabla

        agregarCelda(tr, reg.limites);

        agregarCelda(tr, reg.afecta);

        agregarCelda(tr, reg.lastima);

        agregarCelda(tr, reg.emocional);

        var td = document.createElement("td");

        var btnModificarFila = document.createElement("button");  

        btnModificarFila.textContent = "Modificar registro";

        btnModificarFila.onclick = function () { cargarEnFormulario(reg); };

        var btnEliminarFila = document.createElement("button");

        btnEliminarFila.textContent = "Eliminar";

        btnEliminarFila.onclick = function () { eliminar(reg.id); };

        td.appendChild(btnModificarFila);

        td.appendChild(btnEliminarFila);

        tr.appendChild(td);

        tabla.appendChild(tr);

      });

    }

    function agregarCelda(fila, texto) {

      var td = document.createElement("td");

      td.textContent = texto;

      fila.appendChild(td);

    }

    document.getElementById("buscador").oninput = mostrarTabla;

    // ---------- CERRAR TABLA ----------

    document.getElementById("btnCerrar").onclick = function () {

      tablaVisible = false;

      document.getElementById("seccionTabla").style.display = "none";

      document.getElementById("buscador").value = "";

      document.getElementById("tabla").innerHTML = "";

    };

    // ---------- Pasar el registro al formulario ----------

    function cargarEnFormulario(reg) {

      document.getElementById("id").value = reg.id;

      // >>> AGREGAR CAMPO NUEVO (lugar 5 de 6)

      // Agrega una línea por cada campo (aquí SÍ todas terminan en punto y coma).

      document.getElementById("reaccion").value = reg.reaccion;

      document.getElementById("limites").value = reg.limites;

      document.getElementById("afecta").value = reg.afecta;

      document.getElementById("lastima").value = reg.lastima;

      document.getElementById("emocional").value = reg.emocional;

      document.getElementById("estado").textContent =

        "Modificando registro: cambia los datos y presiona Modificar";

      actualizarBotones();

      window.scrollTo(0, 0);                     // sube al formulario

      document.getElementById("nombre").focus(); // cursor en el nombre

    }

    // ---------- MODIFICAR ----------

    document.getElementById("btnModificar").onclick = function () {

      var id = document.getElementById("id").value;

      if (id === "") {

        alert("Primero elige un registro con el botón 'Modificar registro'");

        return;

      }

      if (!document.getElementById("formulario").reportValidity()) return;

      document.getElementById("estado").textContent = "Modificando...";

      enviar({

        accion: "editar",

        id: id,

        // >>> AGREGAR CAMPO NUEVO (lugar 6 de 6)

        // Igual que en REGISTRAR: coma en todos, menos en el último.

        reaccion: document.getElementById("reaccion").value,

        afecta: document.getElementById("limites").value,

        limites: document.getElementById("afecta ").value,

        lastima: document.getElementById("lastima").value,

        emocional: document.getElementById("emocional").value

      }).then(function (respuesta) {

        terminarAccion(respuesta, "¡Registro modificado!");

      });

    };

    // ---------- ELIMINAR ----------

    document.getElementById("btnEliminar").onclick = function () {

      eliminar(document.getElementById("id").value);

    };

    function eliminar(id) {

      if (!confirm("¿Seguro que quieres eliminar este registro?")) return;

      document.getElementById("estado").textContent = "Eliminando...";

      enviar({ accion: "eliminar", id: id }).then(function (respuesta) {

        terminarAccion(respuesta, "Registro eliminado");

      });

    }

    // ---------- Mensaje al terminar cualquier acción ----------

    function terminarAccion(respuesta, mensajeOk) {

      document.getElementById("estado").textContent =

        respuesta.ok ? mensajeOk : "Error: " + respuesta.mensaje;

      limpiarFormulario();

      if (tablaVisible) cargarRegistros();  // refresca la tabla si está abierta

    }

    actualizarBotones();

  </script>

</body>

</html>
